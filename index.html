<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Subtitle Link Generator</title>
</head>
<body>
    <h2>YouTube Subtitle Link Generator</h2>
    <label for="videoUrl">Enter YouTube URL:</label>
    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    
    <label for="subtitleLang">Select Subtitle Language:</label>
    <select id="subtitleLang">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ar">Arabic</option>
        <option value="zh">Chinese</option>
        <option value="ru">Russian</option>
    </select>
    
    <button onclick="generateLink()">Generate Link</button>
    
    <p id="output"></p>

    <script>
        function generateLink() {
            let url = document.getElementById("videoUrl").value;
            let lang = document.getElementById("subtitleLang").value;
            
            let videoIdMatch = url.match(/[?&]v=([^&]+)/);
            if (!videoIdMatch) {
                document.getElementById("output").innerText = "Invalid YouTube URL";
                return;
            }
            let videoId = videoIdMatch[1];
            let modifiedUrl = `https://www.youtube.com/watch?v=${videoId}&cc_lang_pref=${lang}&cc_load_policy=1`;
            
            document.getElementById("output").innerHTML = `<a href="${modifiedUrl}" target="_blank">Open Video with ${lang.toUpperCase()} Subtitles</a>`;
        }
    </script>
</body>
</html>
