<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Subtitle Sync</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let subtitles = [];
        let player;

        // Initialize YouTube player
        function onYouTubePlayerAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: 'UkZxPIZ1ngY',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });

            // Fetch and parse the SRT subtitles
            fetchSRT('UkZxPIZ1ngY-en.srt');
        }

        // Play the video when ready
        function onPlayerReady(event) {
            console.log("Player ready.");
            event.target.playVideo();
        }

        // Handle player state changes (e.g., playing, paused)
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                console.log("Video is playing.");
                syncSubtitles(event.target);
            }
        }

        // Fetch SRT file (subtitle file)
        function fetchSRT(srtFile) {
            console.log(`Fetching SRT file: ${srtFile}`);
            fetch(srtFile)
                .then(response => response.text())
                .then(data => parseSRT(data))
                .catch(error => console.error("Error fetching SRT:", error));
        }

        // Parse SRT data into subtitle timings and text
        function parseSRT(data) {
            console.log("Parsing SRT...");
            const lines = data.split('\n\n');
            lines.forEach(line => {
                const parts = line.split('\n');
                if (parts.length >= 3) {
                    const time = parts[1].split(' --> ');
                    const start = parseTime(time[0]);
                    const end = parseTime(time[1]);
                    const text = parts.slice(2).join(' ');
                    subtitles.push({ start, end, text });
                    console.log(`Subtitle parsed: ${text} from ${start}s to ${end}s`);
                }
            });
        }

        // Convert time from SRT format to seconds
        function parseTime(timeString) {
            const parts = timeString.split(':');
            const secondsParts = parts[2].split(',');
            return (
                parseInt(parts[0]) * 3600 +
                parseInt(parts[1]) * 60 +
                parseInt(secondsParts[0]) +
                parseInt(secondsParts[1]) / 1000
            );
        }

        // Sync subtitles with video
        function syncSubtitles(player) {
            const currentTime = player.getCurrentTime();
            console.log(`Current time: ${currentTime}s`);

            const subtitle = subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
            const subtitleElement = document.getElementById('subtitles');
            
            if (subtitle) {
                console.log(`Displaying subtitle: ${subtitle.text}`);
                subtitleElement.innerText = subtitle.text;
            } else {
                subtitleElement.innerText = "";  // Clear subtitle if none found
            }
        }

        // Set an interval to keep syncing subtitles
        setInterval(() => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                syncSubtitles(player);
            }
        }, 500);
    </script>
</head>
<body onload="onYouTubePlayerAPIReady()">
    <h2>YouTube Subtitle Sync</h2>
    <div id="player"></div>
    <p id="subtitles" style="font-size: 18px; font-weight: bold; margin-top: 10px;"></p>
</body>
</html>
